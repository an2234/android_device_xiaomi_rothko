name: Build TWRP for Xiaomi 14T Pro
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Your Tree
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Swap
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Compatible Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gperf libxml2-utils lzop rsync unzip zip python2 python3

      - name: Fetch Minimal Build Tools
        run: |
          mkdir ~/bin && curl https://googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          mkdir ~/twrp && cd ~/twrp
          repo init -u https://github.com -b twrp-14.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Inject Tree & Build
        run: |
          cd ~/twrp
          mkdir -p device/xiaomi/rothko
          cp -r $GITHUB_WORKSPACE/* device/xiaomi/rothko/
          export ALLOW_MISSING_DEPENDENCIES=true
          . build/envsetup.sh
          lunch twrp_rothko-eng || true
          mka vendor_bootimage -j$(nproc)

      - name: Upload TWRP Recovery
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Rothko-Android16
          path: ~/twrp/out/target/product/rothko/vendor_boot.img
