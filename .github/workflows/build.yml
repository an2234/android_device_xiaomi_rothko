name: Build TWRP for Xiaomi 14T Pro
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          
      - name: Install Repo Tool
        run: |
          mkdir ~/bin
          curl https://googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

      - name: Sync Minimal TWRP Source
        run: |
          export PATH=~/bin:$PATH
          mkdir ~/twrp && cd ~/twrp
          repo init -u https://github.com -b twrp-14.1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Integrate Your Device Tree
        run: |
          cd ~/twrp
          mkdir -p device/xiaomi/rothko
          git clone https://github.com -b main device/xiaomi/rothko

      - name: Compile TWRP Recovery Image
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          . build/envsetup.sh
          lunch twrp_rothko-eng
          mka vendor_bootimage -j$(nproc)

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Xiaomi-14T-Pro
          path: ~/twrp/out/target/product/rothko/vendor_boot.img
