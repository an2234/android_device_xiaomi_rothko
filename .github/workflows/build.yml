name: Robust TWRP Build for Xiaomi 14T Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Your Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Robust Swap
        run: |
          set -eux
          if command -v docker >/dev/null; then
            sudo docker image prune -a -f || true
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          if [ -f /swapfile ]; then
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile || true
          fi
          if ! sudo fallocate -l 8G /swapfile 2>/dev/null; then
            sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
          df -h

      - name: Install Compatible Compilers & JDK
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gperf libxml2-utils lzop rsync \
            unzip zip python3 openjdk-11-jdk ccache

      - name: Fetch Verified Git-Repo Launcher
        run: |
          mkdir -p ~/bin
          curl -s -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x ~/bin/repo
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Sync Minimal TWRP Source Code (canonical manifest)
        run: |
          export PATH=$HOME/bin:$PATH
          mkdir -p ~/twrp && cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_lineageos.git -b twrp-14.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Clean Inject Tree & Compile Recovery
        run: |
          set -e
          export PATH=$HOME/bin:$PATH
          cd ~/twrp
          mkdir -p device/xiaomi/rothko
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='out' "$GITHUB_WORKSPACE/" device/xiaomi/rothko/

          # Normalize Windows CRLFs in shell scripts copied into the device tree
          find device/xiaomi/rothko -type f -name '*.sh' -exec sed -i 's/\r$//' {} + || true

          # Ensure vendorsetup.sh (if present) is executable
          if [ -f device/xiaomi/rothko/vendorsetup.sh ]; then
            chmod +x device/xiaomi/rothko/vendorsetup.sh || true
          fi

          export ALLOW_MISSING_DEPENDENCIES=true
          . build/envsetup.sh

          # Use the product that exists in this tree (omni_boot) instead of twrp_rothko
          lunch omni_boot-eng

          # Try the usual target; if vendor_bootimage isn't available, fall back to bootimage
          if ! mka vendor_bootimage -j$(nproc); then
            mka bootimage -j$(nproc)
          fi

      - name: Upload Finished TWRP Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Rothko-Android16-Run-${{ github.run_number }}
          path: /home/runner/twrp/out/target/product/rothko/vendor_boot.img
